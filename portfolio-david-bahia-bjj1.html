<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>David Bahia | Brazilian Jiu-Jitsu</title>
<meta name="description" content="Portfólio de David Bahia, atleta de Brazilian Jiu-Jitsu: trajetória, pódios e oportunidades de patrocínio.">
<meta property="og:title" content="David Bahia | Brazilian Jiu-Jitsu">
<meta property="og:description" content="Trajetória, conquistas e parcerias de longo prazo no Jiu-Jitsu.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#0B0B0B;--bg2:#151515;--fg:#F5F5F5;--mut:#A3A3A3;--red:#D92332;--line:#2a2a2a;
--disp:'Anton','Bebas Neue',Impact,'Arial Narrow',sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.65 var(--body)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
section{padding:112px 0;border-top:1px solid var(--line)}
h1,h2,h3{font-family:var(--disp);font-weight:400;text-transform:uppercase;line-height:1;margin:0;letter-spacing:.01em}
h2{font-size:clamp(2.6rem,6vw,4.6rem);margin-bottom:48px}
p{max-width:62ch;color:var(--mut);margin:0 0 1em}
.btn{display:inline-block;padding:15px 26px;font-weight:600;font-size:.95rem;border:1px solid var(--fg);transition:background .2s,color .2s,border-color .2s}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.red:hover{background:#b81c29;border-color:#b81c29}
.btn.ghost:hover{background:var(--fg);color:var(--bg)}
/* header */
header{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:rgba(11,11,11,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-family:var(--disp);font-size:1.7rem;letter-spacing:.06em}
.logo i{color:var(--red);font-style:normal}
nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-size:.9rem}
nav a{color:var(--mut);padding:6px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
nav a:hover{color:var(--fg);border-color:var(--red)}
#burger{display:none;background:none;border:1px solid var(--line);color:var(--fg);width:44px;height:44px;cursor:pointer}
@media(max-width:860px){
#burger{display:block}
nav{position:absolute;top:100%;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);display:none}
nav.open{display:block}
nav ul{flex-direction:column;gap:0;padding:8px 24px 16px}
nav a{display:block;padding:14px 0;font-size:1.05rem;border-bottom:1px solid var(--line)}}
/* hero */
#inicio{min-height:100svh;padding:0;border:0;display:grid;grid-template-columns:1.05fr .95fr;align-items:stretch}
.hero-txt{display:flex;flex-direction:column;justify-content:center;padding:130px 24px 80px max(24px,calc((100vw - 1180px)/2 + 24px))}
.hero-txt h1{font-size:clamp(4rem,10vw,8.5rem);margin-bottom:12px}
.hero-txt .mod{color:var(--red);font-weight:600;margin-bottom:28px;letter-spacing:.08em}
.hero-txt .motto{font-family:var(--disp);font-size:clamp(1.3rem,2.4vw,1.9rem);text-transform:uppercase;margin-bottom:18px}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px}
.photo{position:relative;background:var(--bg2);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:18px;color:var(--mut);font-size:.8rem;
background:repeating-linear-gradient(135deg,#151515 0 14px,#101010 14px 28px)}
.ph span{border-left:2px solid var(--red);padding-left:10px;max-width:30ch}
#inicio .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0,transparent 35%),linear-gradient(0deg,rgba(11,11,11,.7),transparent 40%);pointer-events:none}
@media(max-width:860px){#inicio{grid-template-columns:1fr}.photo.hero{order:-1;height:46svh}.hero-txt{padding:36px 24px 72px}}
/* sobre */
.sobre{display:grid;grid-template-columns:1fr 1fr;gap:64px}
dl{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}
dl div{border:1px solid var(--line);background:var(--bg2);padding:16px 18px 18px;min-width:0}
dt{color:var(--mut);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
dd{margin:0;font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
@media(max-width:480px){dl{grid-template-columns:1fr 1fr}}
.todo{color:var(--red)}
@media(max-width:860px){.sobre{grid-template-columns:1fr;gap:40px}}
/* trajetória: pódios */
.tag{display:inline-block;border:1px solid var(--red);color:var(--red);font-size:.75rem;padding:2px 9px;margin-top:6px}
.pd{text-align:center}
.pd h2{margin-bottom:14px}
.pd .sub{margin:0 auto 14px}
.pd .tag{margin:0 0 40px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:32px auto 56px;max-width:760px}
.stats div{border:1px solid var(--line);background:var(--bg2);padding:26px 8px 20px}
.stats b{display:block;font-family:var(--disp);font-weight:400;font-size:3.4rem;line-height:1}
.stats .g b{color:var(--red)}
.stats span{display:block;margin-top:10px;font-size:.75rem;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.pl{list-style:none;margin:0;padding:0;columns:3;column-gap:48px;text-align:left;border-top:1px solid var(--line)}
.pl li{break-inside:avoid;display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.bd{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:.8rem;border:1px solid var(--mut);color:var(--fg)}
.bd.ouro{background:var(--red);border-color:var(--red)}
.bd.prata{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bd.bronze{border-color:var(--red);color:var(--red)}
.bd svg{width:14px;height:14px;fill:var(--fg)}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.pl{columns:2}}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.pl{columns:1}}
/* conquistas */
.res{border-top:1px solid var(--line)}
.res article{display:grid;grid-template-columns:110px 1fr auto;gap:24px;align-items:baseline;padding:26px 0;border-bottom:1px solid var(--line)}
.res .pos{font-family:var(--disp);font-size:3.6rem;color:var(--red);line-height:1}
.res h3{font-size:1.7rem}
.res p{margin:4px 0 0}
.empty{border:1px dashed var(--line);padding:40px;background:var(--bg2)}
.empty h3{font-size:1.6rem;margin-bottom:10px}
@media(max-width:640px){.res article{grid-template-columns:80px 1fr}.res article>span{grid-column:2}}
/* galeria */
.gal{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:150px;gap:10px}
.gal button{all:unset;cursor:zoom-in;position:relative;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.gal button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.gal button:nth-child(1){grid-column:span 3;grid-row:span 3}
.gal button:nth-child(2){grid-column:span 3;grid-row:span 2}
.gal button:nth-child(3){grid-column:span 3;grid-row:span 1}
.gal button:nth-child(4){grid-column:span 2;grid-row:span 2}
.gal button:nth-child(5){grid-column:span 2;grid-row:span 2}
.gal button:nth-child(6){grid-column:span 2;grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gal button:hover img{transform:scale(1.04)}
@media(max-width:700px){.gal{grid-template-columns:1fr 1fr;grid-auto-rows:130px}.gal button:nth-child(n){grid-column:span 1;grid-row:span 2}.gal button:nth-child(1){grid-column:span 2}}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:24px}
#lb.on{display:flex}
#lb figure{margin:0;width:min(1000px,100%);max-height:100%}
#lb .box{position:relative;aspect-ratio:3/2;background:var(--bg2);border:1px solid var(--line)}
#lb img{width:100%;height:100%;object-fit:contain}
#lb figcaption{color:var(--mut);padding-top:12px}
#lb .x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;background:var(--bg);color:var(--fg);border:1px solid var(--fg);width:46px;height:46px;font-size:1.3rem;cursor:pointer}
/* patrocinio */
.sp{background:var(--bg2)}
.ben{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin:40px 0}
.ben div{padding:28px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ben svg{width:26px;height:26px;stroke:var(--red);fill:none;stroke-width:1.7;margin-bottom:14px}
.ben h3{font-size:1.35rem;margin-bottom:8px}
.ben p{margin:0;font-size:.95rem}
.logos{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:36px}
.logos .slot{flex:1 1 150px;height:78px;border:1px dashed #3a3a3a;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.8rem;text-align:center;padding:8px}
@media(max-width:860px){.ben{grid-template-columns:1fr}}
/* contato */
.cards{list-style:none;padding:0;margin:0 0 32px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cards li{border:1px solid var(--line);background:var(--bg2);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.cards li>span:first-child{color:var(--mut);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.cards a{font-weight:600}
.cards a:hover{color:var(--red)}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.cards{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding:48px 0;color:var(--mut);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px 48px;justify-content:space-between}
footer ul{list-style:none;display:flex;gap:20px;padding:0;margin:0;flex-wrap:wrap}
footer a:hover{color:var(--fg)}
@media(prefers-reduced-motion:no-preference){
.hero-txt>*{animation:up .7s both}.hero-txt>*:nth-child(2){animation-delay:.08s}.hero-txt>*:nth-child(3){animation-delay:.16s}.hero-txt>*:nth-child(4){animation-delay:.24s}.hero-txt>*:nth-child(5){animation-delay:.32s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#inicio" id="logo" aria-label="Início"></a>
  <button id="burger" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav">&#9776;</button>
  <nav id="nav" aria-label="Principal"><ul id="navlist"></ul></nav>
</div></header>

<main>
<section id="inicio" aria-label="Início">
  <div class="hero-txt">
    <h1 id="h-name"></h1>
    <p class="mod">Brazilian Jiu-Jitsu</p>
    <p class="motto" id="h-motto" style="color:var(--fg)"></p>
    <p id="h-intro"></p>
    <div class="cta"><a class="btn red" href="#trajetoria">Conheça minha trajetória</a><a class="btn ghost" href="#patrocinio">Seja um patrocinador</a></div>
  </div>
  <div class="photo hero" id="h-photo"></div>
</section>

<section id="sobre"><div class="wrap">
  <h2>Sobre</h2>
  <div class="sobre"><div id="bio"></div><dl id="facts"></dl></div>
</div></section>

<section id="trajetoria" aria-label="Trajetória"><div class="wrap pd">
  <h2 id="pd-title"></h2>
  <p class="sub" id="pd-sub"></p>
  <span class="tag" id="pd-demo">Conteúdo demonstrativo</span>
  <div class="stats" id="stats"></div>
  <ul class="pl" id="pl"></ul>
</div></section>

<!-- CONQUISTAS (mantida desativada por enquanto)
<section id="conquistas"><div class="wrap">
  <h2>Conquistas</h2>
  <div id="res"></div>
</div></section>
-->

<!-- GALERIA (comentada). Para ativar: descomente esta seção, o bloco #lb mais abaixo, o bloco de JS "GALERIA" e o item Galeria no array nav.
<section id="galeria"><div class="wrap">
  <h2>Galeria</h2>
  <div class="gal" id="gal"></div>
</div></section>
-->

<section id="patrocinio" class="sp"><div class="wrap">
  <h2>Patrocínio</h2>
  <p id="sp-intro" style="color:var(--fg);font-size:1.15rem"></p>
  <div class="ben" id="ben"></div>
  <h3 style="font-size:1.5rem;margin-bottom:16px">Parceiros atuais</h3>
  <div class="logos" id="logos"></div>
  <a class="btn red" href="#contato">Quero apoiar a carreira</a>
</div></section>

<section id="contato"><div class="wrap">
  <h2>Contato</h2>
  <ul class="cards" id="clist"></ul>
  <a class="btn red" id="wa" href="#">Conversar sobre patrocínio</a>
</div></section>
</main>

<footer><div class="wrap">
  <div><strong id="f-name" style="color:var(--fg)"></strong><br>Brazilian Jiu-Jitsu<br><span id="f-copy"></span></div>
  <ul id="f-soc"></ul>
  <ul id="f-nav"></ul>
</div></footer>

<!-- GALERIA: visualização ampliada
<div id="lb" role="dialog" aria-modal="true" aria-label="Imagem ampliada">
  <button class="x" id="lbx" aria-label="Fechar">&#10005;</button>
  <figure><div class="box" id="lbbox"></div><figcaption id="lbcap"></figcaption></figure>
</div>
-->

<script>
/* ===== DADOS EDITÁVEIS: troque tudo aqui. Campos vazios ("") aparecem como placeholders. ===== */
const ATLETA = {
  nome: "David Bahia",
  iniciais: "DB",
  frase: "Disciplina é o que sustenta o talento",
  intro: "Atleta de Brazilian Jiu-Jitsu em busca de evolução constante e parcerias de longo prazo com marcas que acreditam no esporte.",
  bio: [
    "Comecei no Jiu-Jitsu buscando evolução tanto dentro quanto fora do tatame. Aquilo que começou como uma disciplina virou uma paixão. Hoje, me vejo como um aspirante a profissional, apaixonado pelo clima das competições.",
    "Atuo pela equipe Santaluz Jiu-Jitsu e sigo uma rotina de atleta, com preparação física e treinos voltados para competições. Também ajudo turmas de jovens atletas a se desenvolverem dentro do esporte."
  ],
  fatos: {
    "Idade": "21",
    "Peso": "63 kg",
    "Categoria": "Adulto: Pluma",
    "Graduação": "Faixa Branca",
    "Equipe": "Santaluz Jiu-Jitsu",
    "Professora": "Keila de Fatima"
  },
  /* Coloque sua foto em assets/bjjFoto.jpeg ou altere o caminho abaixo. */
  fotoHero: "assets/bjjFoto.jpeg",
  podiosSubtitulo: "Destaques, premiações e resultados da minha trajetória",
  /*
    Para cadastrar um resultado, adicione um item:
    { medalha: "ouro", nome: "Nome do campeonato" }
    medalha pode ser "ouro", "prata" ou "bronze".
    "vezes" é opcional, para contar múltiplas conquistas do mesmo tipo.
    Itens com demo: true ficam fora da contagem.
  */
  podios: [
    { medalha: "prata", nome: "Copa Coiteense" },
    { medalha: "prata", nome: "Bonfim Open" }
  ],

  /* CONQUISTAS EXTRA DESATIVADAS POR ENQUANTO
  conquistas: [
    { competicao: "Nome do campeonato", ano: "2025", categoria: "Adulto / Peso", faixa: "Branca", colocacao: "2º" }
  ],
  */

  /* GALERIA DESATIVADA POR ENQUANTO
  galeria: [
    { src: "", alt: "Competição", legenda: "Competição" },
    { src: "", alt: "Treino no tatame", legenda: "Treino" }
  ],
  */

  patrocinadores: [],
  patrocinio: {
    intro: "Busco construir parcerias de longo prazo com marcas que acreditam no esporte e no trabalho feito longe dos holofotes. Cada ação é combinada com o parceiro.",
    beneficios: [
      ["Redes sociais", "Divulgação da marca nos perfis do atleta, quando acordado."],
      ["Conteúdo esportivo", "Produção de fotos e vídeos de treino e competição com a sua marca."],
      ["Materiais promocionais", "Exposição da marca em materiais de divulgação, quando permitido."],
      ["Ações personalizadas", "Projetos desenvolvidos sob medida com cada parceiro."],
      ["Parceria de longo prazo", "Acompanhamento da temporada e relatórios de resultados."],
      ["Presença em eventos", "Visibilidade em campeonatos e eventos, conforme combinado."]
    ]
  },
  contato: {
    whatsapp: "5575991021996",
    instagram: "davidbahia_",
    email: "davidbahiaBJJ@gmail.com"
  }
};
/* ======================================================================================== */
const $=s=>document.querySelector(s), E=t=>(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const A=ATLETA, C=A.contato, TODO='<span class="todo">[preencher]</span>';
const nav=[["inicio","Início"],["sobre","Sobre"],["trajetoria","Trajetória"],/* ["conquistas","Conquistas"], ["galeria","Galeria"], */["patrocinio","Patrocínio"],["contato","Contato"]];
document.title=A.nome+" | Brazilian Jiu-Jitsu";
$("#logo").innerHTML=E(A.iniciais.slice(0,1))+"<i>.</i>"+E(A.iniciais.slice(1));
$("#navlist").innerHTML=nav.map(n=>`<li><a href="#${n[0]}">${n[1]}</a></li>`).join("");
$("#f-nav").innerHTML=nav.slice(1).map(n=>`<li><a href="#${n[0]}">${n[1]}</a></li>`).join("");
$("#h-name").textContent=A.nome; $("#h-motto").textContent=A.frase; $("#h-intro").textContent=A.intro;
const img=(src,alt,lazy)=>src?`<img src="${E(src)}" alt="${E(alt)}" ${lazy?'loading="lazy"':''}>`:`<div class="ph"><span>Substitua: ${E(alt)}</span></div>`;
$("#h-photo").innerHTML=img(A.fotoHero,"foto principal do atleta de kimono (assets/bjjFoto.jpeg)");
$("#bio").innerHTML=A.bio.map(p=>`<p>${E(p)}</p>`).join("");
$("#facts").innerHTML=Object.entries(A.fatos).map(([k,v])=>`<div><dt>${E(k)}</dt><dd>${v?E(v):TODO}</dd></div>`).join("");
const MN = { ouro: "1º", prata: "2º", bronze: "3º" };
const star = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8l-6.4 3.7 1.7-7.2L2 9.6 9 9z"/></svg>';

// Só os resultados reais entram na contagem.
const real = (A.podios || []).filter(p => !p.demo);
const contar = medalha => real
  .filter(p => p.medalha === medalha)
  .reduce((total, p) => total + (Number(p.vezes) > 0 ? Number(p.vezes) : 1), 0);

const ouro = contar("ouro");
const prata = contar("prata");
const bronze = contar("bronze");
const totalPodios = ouro + prata + bronze;

$("#pd-title").textContent = totalPodios
  ? `${totalPodios} ${totalPodios === 1 ? "pódio" : "pódios"}`
  : "Minha trajetória";
$("#pd-sub").textContent = A.podiosSubtitulo || "";
$("#pd-demo").style.display = (A.podios || []).some(p => p.demo) ? "inline-block" : "none";

$("#stats").innerHTML = [
  ["ouro", "Ouro", ouro, "g"],
  ["prata", "Prata", prata, ""],
  ["bronze", "Bronze", bronze, ""]
].map(([id, nome, quantidade, classe]) =>
  `<div class="${classe}"><b>${quantidade}</b><span>${nome}${quantidade === 1 ? "" : "s"}</span></div>`
).join("");

const ordem = { ouro: 0, prata: 1, bronze: 2 };
$("#pl").innerHTML = [...real]
  .sort((a, b) => (ordem[a.medalha] ?? 99) - (ordem[b.medalha] ?? 99))
  .map(p => `<li><span class="bd ${MN[p.medalha] ? p.medalha : ""}">${MN[p.medalha] || star}</span><span>${E(p.nome)}${Number(p.vezes) > 1 ? " · " + Number(p.vezes) + "x" : ""}</span></li>`)
  .join("");
/* ---- GALERIA (comentada; descomente junto com o HTML) ----
const gal=$("#gal");
gal.innerHTML=A.galeria.slice(0,6).map((g,i)=>`<button data-i="${i}" aria-label="Ampliar: ${E(g.legenda)}">${img(g.src,g.alt,true)}</button>`).join("");
const lb=$("#lb");let last;
function open(i){const g=A.galeria[i];last=document.activeElement;$("#lbbox").innerHTML=img(g.src,g.alt);$("#lbcap").textContent=g.legenda;lb.classList.add("on");$("#lbx").focus();document.body.style.overflow="hidden"}
function close(){lb.classList.remove("on");document.body.style.overflow="";last&&last.focus()}
gal.addEventListener("click",e=>{const b=e.target.closest("button");if(b)open(+b.dataset.i)});
$("#lbx").onclick=close;lb.addEventListener("click",e=>{if(e.target===lb)close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&lb.classList.contains("on"))close()});

const ico='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>';
$("#sp-intro").textContent=A.patrocinio.intro;
$("#ben").innerHTML=A.patrocinio.beneficios.map(b=>`<div>${ico}<h3>${E(b[0])}</h3><p>${E(b[1])}</p></div>`).join("");
$("#logos").innerHTML=A.patrocinadores.length?A.patrocinadores.map(s=>`<div class="slot"><img src="${E(s.logo)}" alt="${E(s.nome)}" style="max-height:100%;max-width:100%"></div>`).join(""):'<div class="slot">Espaço para logotipos dos patrocinadores atuais</div>'.repeat(3);
const ig = C.instagram ? `https://instagram.com/${E(C.instagram.replace(/^@/, ""))}` : "";
const numeroWhatsApp = String(C.whatsapp || "").replace(/\D/g, "");
const dig = numeroWhatsApp.startsWith("55") && numeroWhatsApp.length >= 12
  ? numeroWhatsApp.slice(2)
  : numeroWhatsApp;
const wa = dig ? `https://wa.me/55${dig}` : "";
const ml = C.email ? `mailto:${E(C.email)}` : "";

function formatarWhatsApp(numero) {
  const n = String(numero || "").replace(/\D/g, "").replace(/^55(?=\d{10,11}$)/, "");
  if (n.length === 11) return n.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
  if (n.length === 10) return n.replace(/^(\d{2})(\d{4})(\d{4})$/, "($1) $2-$3");
  return numero || "";
}

const row = (k, v, h) =>
  `<li><span>${k}</span>${v ? (h ? `<a href="${h}" target="_blank" rel="noopener noreferrer">${E(v)}</a>` : E(v)) : TODO}</li>`;

$("#clist").innerHTML =
  row("WhatsApp", formatarWhatsApp(C.whatsapp), wa) +
  row("Instagram", C.instagram && "@" + C.instagram.replace(/^@/, ""), ig) +
  row("E-mail", C.email, ml);
$("#wa").href=wa||"#contato";
$("#f-name").textContent=A.nome;$("#f-copy").textContent="© "+new Date().getFullYear()+" "+A.nome+". Todos os direitos reservados.";
$("#f-soc").innerHTML=[["Instagram",ig],["WhatsApp",wa],["E-mail",ml]].filter(s=>s[1]).map(s=>`<li><a href="${s[1]}" rel="noopener">${s[0]}</a></li>`).join("")||"<li>Redes sociais: preencher</li>";
const bg=$("#burger"),nv=$("#nav");
bg.onclick=()=>{const o=nv.classList.toggle("open");bg.setAttribute("aria-expanded",o)};
nv.addEventListener("click",e=>{if(e.target.closest("a")){nv.classList.remove("open");bg.setAttribute("aria-expanded","false")}});
</script>
